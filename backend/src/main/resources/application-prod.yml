spring:
  jpa:
    hibernate:
      ddl-auto: validate   # never auto-alter schema in production — fail loudly instead if entities and DB disagree
    show-sql: false

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  level:
    root: WARN
    com.pawfind: INFO